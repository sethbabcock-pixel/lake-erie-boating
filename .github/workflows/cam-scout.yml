name: Cam scout

# On-demand: crawls a webcam directory and reports which cams are live + legally
# embeddable (see scripts/scout-cams.mjs). Defaults to the lakerart.com Great
# Lakes list; pass a `directory` URL to scout a new region (e.g. a Chesapeake or
# Carolina coast directory). Read the run log / artifact for the CAM| report lines.

on:
  workflow_dispatch:
    inputs:
      directory:
        description: "Webcam directory URL to crawl (blank = Great Lakes default)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scout cams
        env:
          SCOUT_SEED: ${{ inputs.directory }}
        run: node scripts/scout-cams.mjs | tee scout-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-report
          path: scout-report.txt
